<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Card</title>
</head>

<body class="flex items-center justify-center min-h-screen">
    
    <div class="card-container lg:h-fit md:h-140 bg-gray-300 text-center shadow-sm hover:shadow-teal-200 hover:shadow-lg  rounded-lg md:rounded-4xl p-5 justify-center w-70 md:w-120 flex flex-col items-center ">
        <img src="Tahsan.jpg" class="object-cover md:max-h-90  w-fit rounded-lg md:rounded-4xl" alt="">

        <div class="flex flex-col space-y-2 mt-5 md:mt-8">
            <h3 class="font-bold text-3xl">Tahsan Khan</h3>
            <p class="md:text-xl md:mb-4">A social influencer</p>
         <div class="social py-3 space-x-3 md:space-x-8 md:text-2xl">
                <i class="fa-brands fa-xl hover:scale-110 duration-100 hover:text-blue-600 fa-facebook"></i>
                <i class="fa-brands fa-xl hover:scale-110 duration-100 hover:text-blue-600 fa-x-twitter"></i>
                <i class="fa-brands fa-xl hover:scale-110 duration-100 hover:text-red-600 fa-instagram"></i>
                <i class="fa-brands fa-xl hover:scale-110 duration-100 hover:text-blue-600 fa-square-linkedin"></i>

            </div>
        </div>

    </div>


</body>

</html>
