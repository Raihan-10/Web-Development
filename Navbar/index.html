<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div
        class="navbar h-20 md:w-full flex justify-between gap-10 px-5 md:px-10 items-center bg-gray-200 shadow-xl relative">
        <!--  menu icon for mobile -->
        <div class="md:hidden">
            <i id="menu"
                class="fa-solid fa-xl fa-bars text-blue-500 hover:scale-120 hover:text-red-500  duration-800"></i>
        </div>
        <!-- logo -->
        <h3 class="font-bold text-2xl md:text-4xl text-blue-600 hover:text-blue-700 hover:scale-110 duration-800">Travel
        </h3>

        <ul id="menu-for-lg" class="absolute text-center hidden md:static z-50 md:flex md:flex-row flex-col bg-neutral-100 md:bg-gray-200 top-20 left-0  w-full md:gap-10 md:w-auto md:text-lg">
            <li class="hover:bg-blue-400 transition duration-500 md:w-fit md:p-2 md:rounded-sm p-4">Home</li>
            <li class="hover:bg-blue-400 transition duration-500 md:w-fit md:p-2 md:rounded-sm p-4">Places</li>
            <li class="hover:bg-blue-400 transition duration-500 md:w-fit md:p-2 md:rounded-sm p-4">Register</li>
            <li class="hover:bg-blue-400 transition duration-500 md:w-fit md:p-2 md:rounded-sm p-4">Contact</li>
        </ul>
    </div>

    <script src="./index.js"></script>
</body>

</html>
