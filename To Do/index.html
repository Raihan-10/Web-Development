<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Todo</title>
</head>

<body class="text-center">
    <h2 class="text-4xl">To Do</h2>
    <div class="mt-10">
        <!-- <label for="">Add your todo</label> -->
        <input class="bg-gray-100 w-70" type="text" id="input">
        <button id="add-btn" class="btn bg-blue-300 px-3 font-bold rounded-md cursor-pointer">Add</button>

    </div>
    <div class="flex flex-col  justify-center items-center">
        <ul id="list-container" class="mt-5 text-start px-2 max-w-100 bg-blue-50">
            <!-- <li class="bg-red-300 inline">delete</li> -->
        </ul>
    </div>
    <script>

        const input = document.getElementById('input');
        const listContainer = document.getElementById('list-container')
        const add = document.getElementById('add-btn');

       function addTask() {
            const inputValue = input.value.trim()      // trim() used so that even if user put a space and then click add, it cannot add a task
            if (inputValue === '') return

            // create list
            const list = document.createElement('li');
            list.classList.add('font-semibold', 'flex', 'justify-between', 'items-center', 'gap-10', 'rounded-2xl')
            // list.innerText = inputValue;


            // text span to get line-through
            const text = document.createElement('span')
            text.innerText = inputValue;

            // create div
            const div = document.createElement('div');
            div.classList.add('flex', 'gap-3');

            // create done button
            const doneBtn = document.createElement('button')
            doneBtn.innerText = 'Done';
            doneBtn.classList.add('bg-green-300', 'hover:bg-green-400', 'cursor-pointer', 'px-3', 'py-1.5', 'font-semibold', 'rounded-2xl')

            // create delete button

            const deleteBtn = document.createElement('button');
            deleteBtn.innerText = 'Delete'
            deleteBtn.classList.add('bg-red-300', 'cursor-pointer', 'hover:bg-red-400', 'px-3', 'py-1.5', 'font-semibold', 'rounded-2xl')


            // append delete and done button
            div.appendChild(deleteBtn)
            div.appendChild(doneBtn)

            // append div button
            list.appendChild(text)
            list.appendChild(div)


            // append list 
            listContainer.appendChild(list)

            input.value = ''
            deleteBtn.addEventListener('click', function () {
                list.remove();
            })
            doneBtn.addEventListener('click', function done() {
               text.classList.toggle('line-through')
            })

        };


       add.addEventListener('click', addTask)
       input.addEventListener('keypress', function (e){

        if(e.key==='Enter'){
            addTask();
        }
       })

    </script>
</body>

</html>
